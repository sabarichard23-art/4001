<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="400">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>400</title>
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
:root{
  /* layout: one fixed screen. slim score bar, a railed felt table with three seated players, a full-width hand of large cards along the bottom */
  --ink:#0d1014; --panel:#1a1f27; --line:#2b323c;
  --felt:#0f6b43; --felt-hi:#22a565; --rail-a:#6b5236; --rail-b:#241a11; --brass:#e3bd6a;
  --paper:#fbf8f1; --card-ink:#15181d; --red:#d0271f; --back:#22386a;
  --text:#f0ebe1; --muted:#9aa3ad; --us:#63d0ac; --them:#f09a6c;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0,#1b2029,var(--ink) 60%) var(--ink);color:var(--text);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

header{display:flex;align-items:center;gap:8px;padding:10px 16px 8px}
.brand{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.5px;line-height:1;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:7px 11px;white-space:nowrap;font-size:13px;font-weight:600;color:var(--text)}

#scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 10px}
.team{background:linear-gradient(180deg,#222833,#171b22);border-radius:12px;padding:6px 12px;display:flex;justify-content:space-between;gap:8px;box-shadow:inset 0 2px 0 var(--us),0 2px 6px rgba(0,0,0,.4)}
.team.them{box-shadow:inset 0 2px 0 var(--them),0 2px 6px rgba(0,0,0,.4)}
.team div{display:flex;flex-direction:column;min-width:0}
.team div + div{align-items:flex-end}
.team span{font-size:11px;color:var(--muted);white-space:nowrap}
.team b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.team b.neg{color:var(--them)}

#table{flex:1;min-height:0;margin:66px 18px 0;border-radius:34px;position:relative;border:8px solid transparent;
  background:radial-gradient(ellipse at 50% 40%,var(--felt-hi),var(--felt) 72%) padding-box,linear-gradient(165deg,var(--rail-a),var(--rail-b)) border-box;
  box-shadow:0 14px 30px rgba(0,0,0,.6),inset 0 0 50px rgba(0,0,0,.4)}
#table::before{content:"";position:absolute;inset:9px;border-radius:22px;border:1.5px dashed rgba(255,255,255,.16);pointer-events:none}
#table::after{content:"";position:absolute;inset:0;border-radius:26px;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px);background-size:5px 5px}

.seat{position:absolute;width:78px;display:flex;flex-direction:column;align-items:center;z-index:2}
.seat.top{top:-60px;left:50%;margin-left:-39px}
.seat.left{left:-24px;top:50%;margin-top:-58px}
.seat.right{right:-24px;top:50%;margin-top:-58px}
.fan{position:absolute;top:-10px;left:50%;width:0;height:0}
.fan i{position:absolute;left:-13px;top:0;width:26px;height:38px;border-radius:4px;transform-origin:50% 120%;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 3px,transparent 3px 6px),var(--back);border:1.5px solid #f3ead6;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.av{width:60px;height:60px;border-radius:50%;overflow:hidden;position:relative;border:3px solid #10151b;box-shadow:0 3px 8px rgba(0,0,0,.55);background:#333}
.av svg{display:block;width:100%;height:100%}
.seat.turn .av,#me.turn .av{border-color:var(--brass);box-shadow:0 0 0 3px rgba(227,189,106,.35),0 0 18px rgba(227,189,106,.7);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,189,106,.2),0 0 26px rgba(227,189,106,.9)}}
.nm{margin-top:-9px;position:relative;background:#10151b;border:1.5px solid var(--them);border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.us .nm{border-color:var(--us)}
.tally{margin-top:3px;background:rgba(6,12,10,.8);border-radius:8px;padding:2px 9px;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tally b{font-family:var(--display);font-size:18px;font-weight:700;color:var(--text);line-height:1}
.made .tally{background:#0c3f2c}.made .tally b.w{color:var(--us)}
.tally.got{background:#5ff0a8!important;color:#06301c;box-shadow:0 0 0 2px #06301c}.tally.got b,.tally.got b.w{color:#06301c!important}
.tally.dead{background:#c9261d!important;color:#fff;box-shadow:0 0 0 2px #3d0a07}.tally.dead b,.tally.dead b.w{color:#fff!important}

#trump{position:absolute;left:18px;bottom:16px;font-size:11px;color:rgba(240,235,225,.7);line-height:1.2;z-index:1}
#trump b{display:block;font-size:22px;color:#ff8f86;line-height:1}
#trick{position:absolute;left:50%;top:50%;width:0;height:0;z-index:1}
#trick .card{position:absolute;margin:-52px 0 0 -37px}
#trick .card.in{animation:slide .22s ease-out}
#trick .card.out{animation:collect .32s ease-in forwards}
@keyframes slide{from{transform:translate(var(--fx),var(--fy)) scale(.9);opacity:.3}}
@keyframes collect{to{transform:translate(var(--tx),var(--ty)) scale(.5);opacity:0}}
#msg{position:absolute;right:16px;left:90px;bottom:18px;text-align:right;font-size:13px;font-weight:500;color:rgba(240,235,225,.92);min-height:18px;z-index:1}

.card{width:74px;height:104px;border-radius:9px;background:#fff;color:var(--card-ink);border:1px solid rgba(0,0,0,.45);box-shadow:0 4px 10px rgba(0,0,0,.55);
  font-family:var(--display);font-weight:700;display:flex;flex-direction:column;align-items:flex-start;padding:3px 0 0 6px;line-height:.92;user-select:none;position:relative;overflow:hidden}
.card.r{color:var(--red)}
.card .rk{font-size:36px;letter-spacing:-1px}
.card .st{font-size:27px;font-family:"Segoe UI Symbol","Apple Symbols",sans-serif;font-weight:400}
.card .pip{position:absolute;right:6px;bottom:0;font-size:50px;line-height:1.1;font-family:"Segoe UI Symbol","Apple Symbols",sans-serif;font-weight:400}
.card.win{box-shadow:0 0 0 3px var(--brass),0 0 18px rgba(227,189,106,.8)}

#pad{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(180deg,#0e2a20,#081710);border-radius:20px;padding:14px 14px 16px;width:224px;z-index:5;border:1px solid rgba(227,189,106,.45);box-shadow:0 12px 30px rgba(0,0,0,.6)}
#pad h2{margin:0;font-family:var(--display);font-size:24px;font-weight:700;text-align:center}
#pad p{margin:2px 0 12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.12);font-size:12px;color:var(--muted);text-align:center}
#pad .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
#pad button{background:linear-gradient(180deg,#fffdf6,#e6dcc4);color:var(--card-ink);border:0;border-radius:10px;height:44px;font-family:var(--display);font-size:24px;font-weight:700;box-shadow:0 3px 0 #a99a78,0 6px 10px rgba(0,0,0,.45)}
#pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #a99a78}
#pad button:disabled{opacity:.22;box-shadow:none;cursor:default}

footer{padding:8px 6px 10px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35))}
#me{display:flex;align-items:center;gap:10px;padding:0 10px 2px;min-height:46px}
#me .av{width:42px;height:42px;border-width:2px;flex:none}
#me .txt{display:flex;flex-direction:column;line-height:1.2}
#me .txt strong{font-size:14px}
#me .txt span{font-size:12px;color:var(--muted)}
#me .tally{margin:0 0 0 auto;font-size:12px;padding:4px 12px}
#me .tally b{font-size:22px}
#hand{position:relative;height:172px}
#hand .card{position:absolute;top:12px;width:106px;height:158px;border-radius:11px;padding:5px 0 0 5px;transition:transform .12s,filter .15s;box-shadow:-4px 0 8px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.5)}
#hand .card .rk{font-size:var(--rk,40px);letter-spacing:-1px}
#hand .card .rk.ten{display:inline-block;letter-spacing:-.05em;transform:scaleX(var(--ten,.6));transform-origin:left center;white-space:nowrap}
#hand .card .st{font-size:31px;margin-left:-2px}
#hand .card .pip{font-size:72px;right:8px}
#hand .card.ok{transform:translateY(-12px)}
#hand .card.no{filter:brightness(.58)}
#hand .card.q{transform:translateY(-40px);box-shadow:0 0 0 3px var(--brass),0 0 18px var(--brass),0 8px 16px rgba(0,0,0,.6)}
#hand button.card{appearance:none;text-align:left}

#sheet{position:absolute;inset:0;background:rgba(6,8,11,.8);z-index:10;display:flex;align-items:center;justify-content:center;padding:16px}
#sheet[hidden],#pad[hidden]{display:none}
.box{background:linear-gradient(180deg,#222833,#161a21);border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:100%;overflow:auto;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.7)}
.box h2{font-family:var(--display);font-size:30px;font-weight:700;margin:0 0 4px;text-wrap:balance}
.box p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.45}
.box table{width:100%;border-collapse:collapse;margin-bottom:16px;font-variant-numeric:tabular-nums}
.box th{font-size:11px;font-weight:500;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.box th:first-child,.box td:first-child{text-align:left}
.box td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);font-size:15px}
.box td.up{color:var(--us);font-weight:700}.box td.down{color:var(--them);font-weight:700}
.box tr.us td:first-child{box-shadow:inset 3px 0 0 var(--us);padding-left:10px}
.box tr.them td:first-child{box-shadow:inset 3px 0 0 var(--them);padding-left:10px}
.primary{width:100%;background:linear-gradient(180deg,#f1cf82,#d4a94f);color:#1a1509;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:16px;box-shadow:0 3px 0 #8f6f2c}
.lvrow{margin-bottom:14px}.lvrow h3{margin:0 0 6px;font-size:14px;font-weight:600}.lvrow h3 span{color:var(--muted);font-weight:400}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#0f1318;border-radius:10px;padding:4px}
.seg button{background:transparent;border:0;border-radius:7px;padding:9px 0;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brass);color:#1a1509}
.ghost:disabled{opacity:.35;cursor:default}
.ghost.dot{border-color:var(--brass);color:var(--brass)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.field input{background:#0f1318;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;color:var(--text)}
.chairs{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.chair{display:flex;align-items:center;gap:10px;background:#0f1318;border-radius:10px;padding:8px 10px;border-left:3px solid var(--us)}
.chair.b{border-left-color:var(--them)}
.chair div{flex:1;min-width:0}.chair strong{display:block;font-size:14px;overflow-wrap:anywhere}.chair span{font-size:12px;color:var(--muted)}
.chair button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600}
.second{width:100%;background:transparent;border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;font-size:15px;margin-top:8px}
#watch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px;padding:0 24px}
.screen{position:absolute;inset:0;padding-top:calc(24px + env(safe-area-inset-top))!important;z-index:8;background:radial-gradient(ellipse at 50% 20%,#17513c,var(--ink) 65%) var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;overflow:auto}
.screen[hidden],.ghost[hidden],#hNew[hidden]{display:none}
.logo{font-family:var(--display);font-weight:700;font-size:110px;line-height:.9;letter-spacing:-2px;color:var(--paper);text-shadow:0 6px 24px rgba(0,0,0,.5)}
.tag{color:var(--muted);margin:8px 0 34px;font-size:15px}
.stack{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.stack .second{margin-top:0}
.primary.alt{background:linear-gradient(180deg,#7fdcbc,#4fb293);box-shadow:0 3px 0 #2c7560}
.joinrow{display:flex;gap:8px;margin-top:14px}
.joinrow input{flex:1;min-width:0;background:#0f1318;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:16px;color:var(--text);text-transform:uppercase;letter-spacing:2px}
.joinrow .second{width:auto;white-space:nowrap;padding:12px 14px}
#hNote{min-height:20px;margin:0;color:var(--them);font-size:13px;text-align:center}
#lobby{justify-content:flex-start}
#lobby .box{margin:auto 0}
.codebar{display:flex;align-items:center;gap:12px;background:#0f1318;border-radius:12px;padding:10px 12px;margin-bottom:14px}
.codebar div{flex:1;display:flex;flex-direction:column}.codebar span{font-size:12px;color:var(--muted)}
.codebar b{font-family:var(--display);font-size:32px;letter-spacing:4px;line-height:1}
.codebar .second{width:auto;margin:0;padding:10px 14px;border-color:var(--brass);color:var(--brass)}
.chair select{background:#1a1f27;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 4px;font:inherit;font-size:13px;max-width:104px}
#board{position:absolute;left:12px;top:50px;z-index:3;display:grid;grid-template-columns:34px 30px 34px;grid-template-rows:24px 22px 24px;gap:2px;align-items:center;justify-items:center;
  background:rgba(13,16,20,.82);border:1px solid var(--line);border-radius:14px;padding:5px 6px;box-shadow:0 4px 10px rgba(0,0,0,.45)}
#board b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums;min-width:30px;text-align:center;padding:2px 3px;border-radius:7px;background:#0a0d11;color:var(--us)}
#board b.o{color:var(--them)}
#board .t{grid-column:2;grid-row:1}#board .l{grid-column:1;grid-row:2}#board .r{grid-column:3;grid-row:2}#board .m{grid-column:2;grid-row:3}
#board i{grid-column:2;grid-row:2;width:24px;height:16px;border-radius:5px;background:var(--felt-hi);border:2px solid var(--rail-a);display:block}
#hand .card{touch-action:none}
#hand .card.drag{transition:none;z-index:99!important;box-shadow:0 14px 26px rgba(0,0,0,.6)}
#hand .card.drag.go{box-shadow:0 0 0 3px var(--brass),0 14px 26px rgba(0,0,0,.6)}
.bub{position:absolute;z-index:6;background:#fff;color:var(--card-ink);border-radius:18px;padding:7px 14px;font-size:15px;font-weight:600;line-height:1.2;max-width:150px;text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,.5);opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s;pointer-events:none}
.bub.on{opacity:1;transform:scale(1)}
.bub.big{font-size:34px;padding:4px 12px;line-height:1.15}
.bub.num{font-family:var(--display);font-size:26px;font-weight:700;padding:2px 18px}
.bub.p0{left:14px;bottom:10px}.bub.p1{right:-14px;top:calc(50% - 118px)}.bub.p2{left:calc(50% + 30px);top:-56px}.bub.p3{left:-14px;top:calc(50% - 118px)}
#chatBtn{margin-left:auto;padding:6px 12px}
#me .tally{margin-left:0}
p.fine{margin:6px 0 0;text-align:center;font-size:12px}p.fine a{color:var(--muted)}
#hRec{margin:0;color:var(--muted);font-size:13px;text-align:center;line-height:1.5}
.bub{max-width:190px;overflow-wrap:anywhere}
.log{background:#0f1318;border-radius:12px;padding:10px 12px;margin:14px 0 0;max-height:190px;overflow:auto}
.log p{margin:0 0 6px;color:var(--text);font-size:14px;overflow-wrap:anywhere}.log p:last-child{margin:0}.log b{color:var(--us);font-weight:600}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.pick.words{grid-template-columns:repeat(2,1fr)}
.pick button{background:#fff;color:var(--card-ink);border:0;border-radius:12px;min-height:54px;font-size:30px;box-shadow:0 3px 0 #a99a78}
.pick.words button{font-size:15px;font-weight:600;padding:8px}
.box ul{margin:0 0 16px;padding-left:18px;color:var(--text);font-size:14px;line-height:1.5}
@media (max-height:700px){#hand{height:132px}#hand .card{height:120px;width:84px}#hand .card .pip{font-size:48px}.av{width:50px;height:50px}.seat.top{top:-52px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* home hub and table lobby */
.logo.s{font-size:38px;letter-spacing:0;text-shadow:none;line-height:1}
.htop,.ltop{display:flex;align-items:center;gap:8px;width:100%}.htop .logo,.ltop .logo{margin-right:auto}
#home{justify-content:flex-start;overflow:auto}#home .stack{margin:auto 0;max-width:380px}
.hprof{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#1a1f27;border:1px solid var(--line);border-radius:16px;padding:10px 14px;color:var(--text)}
.hprof .av{width:52px;height:52px;flex:none}.hwho{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.25}
.hwho strong{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#hRec{text-align:left;font-size:13px}
.hedit{font-size:13px;font-weight:600;color:var(--brass)}
.hero{border-radius:22px;border:6px solid transparent;background:radial-gradient(ellipse at 50% 30%,var(--felt-hi),var(--felt) 75%) padding-box,linear-gradient(165deg,var(--rail-a),var(--rail-b)) border-box;padding:18px 16px 16px;box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 0 40px rgba(0,0,0,.35)}
.hk{font-size:12px;color:rgba(240,235,225,.85);letter-spacing:.3px}
.ht{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05;margin:4px 0 6px;color:var(--paper)}
.hero p{margin:0 0 14px;font-size:14px;line-height:1.4;color:rgba(240,235,225,.9)}
#lobby{overflow:auto;padding-left:0!important;padding-right:0!important}
#lobbyBox{background:none;border:0;box-shadow:none;padding:0 16px 20px;max-height:none;overflow:visible;margin:0 auto}
.chip{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted)}
.chip b{font-family:var(--display);font-size:16px;letter-spacing:2px;color:var(--text);margin-left:4px}
.lmsg{margin:40px 0 20px!important;text-align:center}

<script>
/* 400 engine + bots. Cards: id 0..51, suit = id/13 (0 spades, 1 hearts, 2 diamonds, 3 clubs), rank = id%13 (0 = two, 12 = ace). */
var E = (function () {
  var TR = 1;
  function S(c) { return (c / 13) | 0; }
  function R(c) { return c % 13; }

  function bidValue(b, score) {
    if (b >= 10) return 40;
    if (b === 9) return 27;
    if (b >= 7) return b * 2;
    if (b >= 5) return score >= 30 ? b : b * 2;
    return b;
  }
  function minBid(score) { return score >= 50 ? 5 : score >= 40 ? 4 : score >= 30 ? 3 : 2; }
  function minTotal(scores) {
    var m = Math.max(scores[0], scores[1], scores[2], scores[3]);
    return m >= 50 ? 14 : m >= 40 ? 13 : m >= 30 ? 12 : 11;
  }
  function gameWinner(s) {
    var t0 = (s[0] >= 41 && s[2] > 0) || (s[2] >= 41 && s[0] > 0);
    var t1 = (s[1] >= 41 && s[3] > 0) || (s[3] >= 41 && s[1] > 0);
    if (t0 && !t1) return 0;
    if (t1 && !t0) return 1;
    if (t0 && t1) {
      var m0 = Math.max(s[0], s[2]), m1 = Math.max(s[1], s[3]);
      if (m0 > m1) return 0;
      if (m1 > m0) return 1;
    }
    return -1;
  }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function deal() {
    var d = []; for (var i = 0; i < 52; i++) d.push(i);
    shuffle(d);
    var h = [];
    for (var p = 0; p < 4; p++) h.push(d.slice(p * 13, p * 13 + 13).sort(function (a, b) { return a - b; }));
    return h;
  }
  function beats(c, w) {
    var sc = S(c), sw = S(w);
    if (sc === sw) return c > w;
    return sc === TR;
  }
  function trickWinnerIdx(trick) {
    var w = trick[0], wi = 0;
    for (var i = 1; i < trick.length; i++) if (beats(trick[i], w)) { w = trick[i]; wi = i; }
    return wi;
  }
  function legalMoves(hand, trick) {
    if (!trick.length) return hand.slice();
    var led = S(trick[0]);
    var f = hand.filter(function (c) { return S(c) === led; });
    return f.length ? f : hand.slice();
  }

  /* ---------- fast heuristic policy (used inside simulations) ---------- */
  function isMaster(c, own, p) {
    var top = S(c) * 13 + 13;
    for (var x = c + 1; x < top; x++) if (own[x] >= 0 && own[x] !== p) return false;
    return true;
  }
  function hasSuit(own, q, s) {
    for (var c = s * 13, e = c + 13; c < e; c++) if (own[c] === q) return true;
    return false;
  }
  function leadPolicy(p, own, bids, won, need, pneed, oppNeed) {
    var o1 = (p + 1) & 3, o2 = (p + 3) & 3, s, c, e;
    var len = [0, 0, 0, 0], lo = [-1, -1, -1, -1], hi = [-1, -1, -1, -1], out = [0, 0, 0, 0];

      var o = own[c]; if (o < 0) continue; s = (c / 13) | 0;
      if (o === p) { len[s]++; if (lo[s] < 0) lo[s] = c; hi[s] = c; } else out[s]++;
    }
    var o1T = hasSuit(own, o1, TR), o2T = hasSuit(own, o2, TR);
    var partner = (p + 2) & 3;

        if (holder === partner) sc = 3;
        else if (!hasSuit(own, partner, s) && hasSuit(own, partner, TR)) sc = 2;
        else sc = 1;

      }
      if (feed >= 0) return feed;
      if (len[TR]) return lo[TR];
    }
    if (need > 0 || oppNeed) {
      var best = -1, bs = -1;
      for (s = 0; s < 4; s++) {
        if (s === TR || !len[s]) continue;
        if (!isMaster(hi[s], own, p)) continue;
        if ((o1T && !hasSuit(own, o1, s)) || (o2T && !hasSuit(own, o2, s))) continue;
        if (out[s] > bs) { bs = out[s]; best = hi[s]; }
      }

      if (need > 0 && len[TR] >= 2 && (o1T || o2T) && isMaster(hi[TR], own, p)) return hi[TR];
    }

    if (!nonT) return lo[TR];
    var pick = -1, i;
    if (need <= 0 && !oppNeed && pneed > 0) {
      for (s = 0; s < 4; s++) if (s !== TR && len[s] && (pick < 0 || R(lo[s]) < R(pick))) pick = lo[s];
      return pick;
    }

      var sl = 99;
      for (s = 0; s < 4; s++) if (s !== TR && len[s] && len[s] <= 2 && len[s] < sl) { sl = len[s]; pick = lo[s]; }

    }
    var ll = -1;
    for (s = 0; s < 4; s++) if (s !== TR && len[s] > ll) { ll = len[s]; pick = lo[s]; }
    return pick;
  }
  function discard(p, own) {
    var best = -1, bv = 1e9, c, tlo = -1;
    for (c = 0; c < 52; c++) {
      if (own[c] !== p) continue;

      var v = (c % 13) + (isMaster(c, own, p) ? 20 : 0);

  function policy(p, own, trick, leader, bids, won) {
    var partner = (p + 2) & 3, o1 = (p + 1) & 3, o2 = (p + 3) & 3;
    var need = bids[p] - won[p], pneed = bids[partner] - won[partner];
    var oppNeed = (bids[o1] - won[o1] > 0) || (bids[o2] - won[o2] > 0);
    if (!trick.length) return leadPolicy(p, own, bids, won, need, pneed, oppNeed);
    var led = S(trick[0]), wi = trickWinnerIdx(trick), w = trick[wi], wp = (leader + wi) & 3;

  /* utility from team 0's side (players 0 and 2) */
  function utility(won, bids, scores) {
    var ns = [0, 0, 0, 0], d = 0;
    for (var q = 0; q < 4; q++) {
      var v = bidValue(bids[q], scores[q]);

    }

  }

  /* ---------- hand strength estimate (for reading bids) ---------- */

    if (dragging) { handDirty = true; return; }
    handDirty = false;
    var box = $('hand'); box.innerHTML = '';
    if (!g) return;
    if (mySeat < 0) { box.innerHTML = '<div id="watch">You are watching. Tap Table to take a chair.</div>'; return; }
    var order = [1,0,2,3];
    var cards = g.hands[mySeat].slice().sort(function(a,b){ return order.indexOf(E.S(a)) - order.indexOf(E.S(b)) || a - b; });
    var myTurn = g.phase === 'play' && myTurnNow();
    var legal = myTurn ? E.legalMoves(g.hands[mySeat], g.trick.map(function(t){ return t.c; })) : [];
    if (queued >= 0 && (g.phase !== 'play' || cards.indexOf(queued) < 0)) queued = -1;
    if (myTurn && queued >= 0) {
      var qc = queued, qt = g.tid; queued = -1;
      if (legal.indexOf(qc) >= 0) {
        firing = qc;
        setTimeout(function(){ firing = -1; if (g && g.tid === qt && g.phase === 'play' && myTurnNow() && g.hands[mySeat].indexOf(qc) >= 0) act('p', qc); }, 350);
      }
    }
    if (firing >= 0 && !myTurn) firing = -1;
    var W = box.clientWidth, n = cards.length;
    var cw = window.innerHeight <= 700 ? 84 : 106;
    var step = n > 1 ? Math.min(cw * 0.7, (W - cw) / (n - 1)) : 0;
    var x0 = (W - (cw + step * (n - 1))) / 2;
    var rkPx = Math.round(Math.max(28, Math.min(48, ((n > 1 ? step : cw) - 6) / 0.46)));
    box.style.setProperty('--rk', rkPx + 'px');

    cards.forEach(function(c, i){
      var el = cardEl(c, 'button'); el.type = 'button';
      el.style.left = (x0 + i * step) + 'px'; el.style.zIndex = i + 1;
      if (myTurn) {
        if (legal.indexOf(c) >= 0) { el.classList.add('ok'); if (c === firing) el.classList.add('q'); dragify(el, c); }
        else { el.classList.add('no'); el.disabled = true; }
      } else if (g.phase === 'play' && cards.length > 0 && !(mode === 'client' && sentTid === g.tid)) {
        if (c === queued) { el.classList.add('q'); el.setAttribute('aria-pressed', 'true'); }
        el.setAttribute('aria-label', (c === queued ? 'Queued: ' : 'Queue ') + (el.getAttribute('aria-label') || 'card'));
        el.onclick = function(){ queued = queued === c ? -1 : c; drawHand(); };
      } else el.disabled = true;
      box.appendChild(el);
    });
    // squeeze the two-digit 10 sideways, at full height, so it fits the visible strip of its card
    Array.prototype.forEach.call(box.querySelectorAll('.rk.ten'), function(t){
      var w = t.offsetWidth, room = (n > 1 ? step : cw) - 7;
      t.style.transform = 'scaleX(' + Math.max(0.35, Math.min(1, room / (w || 1))).toFixed(3) + ')';
    });
  }
  window.addEventListener('resize', function(){ if (g) drawHand(); });

  var armed = 0;
  $('homeBtn').onclick = function(){
    var b = this;
    if (mode === 'solo' || armed) { armed = 0; b.textContent = 'Home'; goHome(); return; }
    armed = 1; b.textContent = mode === 'host' ? 'Close table?' : 'Leave?';
    setTimeout(function(){ armed = 0; b.textContent = 'Home'; }, 3000);
  };
  $('rulesBtn').onclick = rulesSheet;
  $('hProfile').onclick = $('hGear').onclick = $('hTabP').onclick = function(){ profileSheet(); };
  $('hRules').onclick = rulesSheet; $('hFr').onclick = $('hBell').onclick = function(){ friendsSheet(); };
  var JOINLINK = '<p class="fine"><button type="button" class="linkbtn" id="fjoin">Have a table code? Join with it</button></p>';
  function wireJoin(){ if ($('fjoin')) $('fjoin').onclick = joinSheet; }
  function joinSheet(){
    openSheet('join', '<h2>Join a table</h2><p>Enter the four-character code your friend sent you.</p><form id="hJoin" class="joinrow" style="margin:0 0 14px"><input id="hCode" maxlength="4" placeholder="Table code" autocapitalize="characters" autocomplete="off" aria-label="Table code"><button class="primary" type="submit" style="width:auto;padding:12px 18px">Join</button></form><button class="second" id="go" type="button">Cancel</button>');
    $('go').onclick = closeSheet;
    $('hJoin').onsubmit = function(e){ e.preventDefault(); var c = $('hCode').value; sheetKind = ''; $('sheet').hidden = true; $('hNote').textContent = ''; joinLobby(c); };
  }
  $('hSkill').onclick = function skill(){
    openSheet('skill', '<h2>Bot skill</h2><p>How strong each bot is in your next game. You can change it again before every game.</p>' + lvRows([2,1,3], ['your partner','on your right','on your left']) + '<button class="primary" id="go" type="button">Done</button>');
    wireLv($('box'), skill); $('go').onclick = closeSheet;
  };
  $('hRecord').onclick = function(){
    openSheet('rec', '<h2>My record</h2>' + (recLines.length ? '<ul><li>' + recLines.map(esc).join('</li><li>') + '</li></ul>' : '<p>Finish a game against bots and your record shows here.</p>') + '<button class="primary" id="go" type="button">Done</button>');
    $('go').onclick = closeSheet;
  };
  if (document.readyState === 'complete') startFB(); else window.addEventListener('load', startFB);
  $('botsBtn').onclick = botsSheet;
  $('tableBtn').onclick = function(){
    // from a game against bots: open the same game to friends, who can take over bot chairs
    if (mode === 'solo' && g) { netGen++; mode = 'host'; g.nm[mySeat] = nick || 'Host'; openHost(); headerState(); }
    tableSheet();
  };
  $('hFriends').onclick = hostLobby;

  var m = /[?&]room=([A-Za-z0-9]{4})/.exec(location.search);
  if (m) joinLobby(m[1]); else show('home');
})();
